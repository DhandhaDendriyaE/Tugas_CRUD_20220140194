<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTP Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            padding: 40px 0;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            padding: 30px;
            margin-bottom: 30px;
            transition: transform 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
        }

        h2, h5 {
            color: #4b3f92;
            font-weight: 600;
        }

        .btn-primary {
            background: #764ba2;
            border: none;
            border-radius: 10px;
            padding: 10px 25px;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: #5a3682;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.4);
        }

        .table {
            border-radius: 15px;
            overflow: hidden;
            background: white;
        }

        .table thead {
            background: #764ba2;
            color: white;
        }

        /* Animasi loading sederhana */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="loading-overlay" id="loader">
    <div class="spinner-border text-primary" role="status"></div>
</div>

<div class="container">
    <div class="text-center text-white mb-5">
        <h1 class="fw-bold">Database KTP Digital</h1>
        <p class="lead">Kelola data kependudukan dengan cepat dan interaktif</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="glass-card">
                <h5 id="formTitle"><i class="fas fa-user-plus me-2"></i> Input Data KTP</h5>
                <hr>
                <form id="ktpForm">
                    <input type="hidden" id="ktpId">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nomor KTP</label>
                            <input type="text" id="nomorKtp" class="form-control form-control-lg" placeholder="16 Digit NIK" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nama Lengkap</label>
                            <input type="text" id="namaLengkap" class="form-control form-control-lg" placeholder="Sesuai Ijazah" required>
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label">Alamat Domisili</label>
                            <textarea id="alamat" class="form-control" rows="2" placeholder="Nama Jalan, RT/RW, Kec, Kota"></textarea>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Tanggal Lahir</label>
                            <input type="date" id="tanggalLahir" class="form-control form-control-lg" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Jenis Kelamin</label>
                            <select id="jenisKelamin" class="form-select form-select-lg">
                                <option value="Laki-laki">Laki-laki</option>
                                <option value="Perempuan">Perempuan</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary btn-lg w-100" id="btnSubmit">
                            <i class="fas fa-save me-2"></i> Simpan Ke Database
                        </button>
                        <button type="button" class="btn btn-outline-secondary w-100 mt-2 d-none" id="btnCancel" onclick="resetForm()">
                            Batal Edit
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-lg-12">
            <div class="glass-card">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5><i class="fas fa-users me-2"></i> Data Terdaftar</h5>
                    <button class="btn btn-sm btn-outline-primary" onclick="loadData()">
                        <i class="fas fa-sync-alt"></i> Refresh Data
                    </button>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>NIK</th>
                            <th>Nama Lengkap</th>
                            <th>Alamat</th>
                            <th>Lahir</th>
                            <th>Gender</th>
                            <th class="text-center">Aksi</th>
                        </tr>
                        </thead>
                        <tbody id="ktpTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const API_URL = "http://localhost:8080/ktp";

    $(document).ready(function() {
        loadData();

        $("#ktpForm").submit(function(e) {
            e.preventDefault();
            $("#loader").css("display", "flex"); // Show loader

            const id = $("#ktpId").val();
            const data = {
                nomorKtp: $("#nomorKtp").val(),
                namaLengkap: $("#namaLengkap").val(),
                alamat: $("#alamat").val(),
                tanggalLahir: $("#tanggalLahir").val(),
                jenisKelamin: $("#jenisKelamin").val()
            };

            const type = id ? "PUT" : "POST";
            const url = id ? `${API_URL}/${id}` : API_URL;

            $.ajax({
                url: url,
                type: type,
                contentType: "application/json",
                data: JSON.stringify(data),
                success: function() {
                    $("#loader").hide();
                    Swal.fire('Berhasil!', id ? 'Data telah diperbarui.' : 'Data baru telah ditambahkan.', 'success');
                    resetForm();
                    loadData();
                },
                error: function(err) {
                    $("#loader").hide();
                    Swal.fire('Error!', err.responseJSON ? err.responseJSON.message : 'Terjadi kegagalan sistem', 'error');
                }
            });
        });
    });

    function loadData() {
        $.get(API_URL, function(data) {
            let rows = "";
            data.forEach(ktp => {
                rows += `
                    <tr>
                        <td class="fw-bold">${ktp.nomorKtp}</td>
                        <td>${ktp.namaLengkap}</td>
                        <td><small>${ktp.alamat}</small></td>
                        <td>${ktp.tanggalLahir}</td>
                        <td><span class="badge ${ktp.jenisKelamin === 'Laki-laki' ? 'bg-info' : 'bg-danger'}">${ktp.jenisKelamin}</span></td>
                        <td class="text-center">
                            <button class="btn btn-outline-warning btn-sm me-1" onclick="editData(${ktp.id})"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-outline-danger btn-sm" onclick="deleteData(${ktp.id})"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
            });
            $("#ktpTableBody").hide().html(rows).fadeIn(500);
        });
    }

    function deleteData(id) {
        Swal.fire({
            title: 'Yakin hapus data?',
            text: "Data yang dihapus tidak bisa dikembalikan!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'Ya, Hapus!'
        }).then((result) => {
            if (result.isConfirmed) {
                $.ajax({
                    url: `${API_URL}/${id}`,
                    type: "DELETE",
                    success: function() {
                        Swal.fire('Terhapus!', 'Data KTP telah dibuang.', 'success');
                        loadData();
                    }
                });
            }
        });
    }

    function editData(id) {
        $.get(`${API_URL}/${id}`, function(ktp) {
            $("#ktpId").val(ktp.id);
            $("#nomorKtp").val(ktp.nomorKtp).attr("readonly", true);
            $("#namaLengkap").val(ktp.namaLengkap);
            $("#alamat").val(ktp.alamat);
            $("#tanggalLahir").val(ktp.tanggalLahir);
            $("#jenisKelamin").val(ktp.jenisKelamin);

            $("#formTitle").html("<i class='fas fa-edit me-2'></i> Edit Data KTP");
            $("#btnSubmit").html("<i class='fas fa-check me-2'></i> Update Data");
            $("#btnCancel").removeClass("d-none");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    }

    function resetForm() {
        $("#ktpForm")[0].reset();
        $("#ktpId").val("");
        $("#nomorKtp").attr("readonly", false);
        $("#formTitle").html("<i class='fas fa-user-plus me-2'></i> Input Data KTP");
        $("#btnSubmit").html("<i class='fas fa-save me-2'></i> Simpan Ke Database");
        $("#btnCancel").addClass("d-none");
    }
</script>

</body>
</html>
